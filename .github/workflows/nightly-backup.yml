# Nightly database backup (Phase 1 item 7, zero-cost path — 2026-07-25).
#
# What this does, every night:
#   1. 10:00 UTC (≈3:00 AM Pacific) — GitHub Actions cron fires.
#   2. Connects to Supabase Postgres via the SUPABASE_DB_URL repo secret
#      (Settings → Secrets and variables → Actions). Never logged.
#   3. pg_dump of the public schema (task, recurring_task,
#      recurring_completion, event, app_users, verification_tokens) —
#      schema + data, plain SQL, gzipped.
#   4. Uploads the dump as a workflow artifact, kept 90 days → a rolling
#      window of ~90 nightly restore points under the Actions tab.
#   5. Any failure turns the run red and GitHub emails the repo owner —
#      a silently-broken backup cannot happen.
#
# RESTORE PROCEDURE (tested shape — read before you need it):
#   1. Download the artifact from Actions → this workflow → pick a night.
#   2. gunzip multitask-backup-YYYY-MM-DD.sql.gz
#   3. Restore into a FRESH database (e.g. a new Supabase project), then
#      re-run supabase/01..10 for RLS/policies if starting truly clean:
#        psql "$NEW_DB_URL" < multitask-backup-YYYY-MM-DD.sql
#   4. For partial recovery (one table / one user's rows), open the .sql in
#      an editor — it's plain COPY statements — and take what you need.
#
# Limits (accepted): nightly granularity (≤24h exposure; PowerSync's local
# device copies cover the gap in practice); auth-schema accounts are not
# included (accounts are recreatable by email — data rows are what matter).

name: nightly-backup

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch: {} # manual "Run workflow" button for testing

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pg_dump aborts if the client's major version is older than the
      # server's (caught twice by test-fires). Self-adapting: ask the server
      # its version with psql (which tolerates mismatch), install exactly
      # that client from PGDG, and invoke that version's binary by full path
      # (Ubuntu's pg_wrapper can otherwise pick an older preinstalled one).
      - name: Install matching postgres client and dump
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$DB_URL" || { echo "SUPABASE_DB_URL secret is not set"; exit 1; }
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          MAJOR=$(psql "$DB_URL" -tAc "SHOW server_version_num" | head -c2)
          echo "server major version: $MAJOR"
          sudo apt-get install -y -qq "postgresql-client-$MAJOR"
          STAMP=$(date -u +%F)
          "/usr/lib/postgresql/$MAJOR/bin/pg_dump" "$DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --file="multitask-backup-${STAMP}.sql"
          gzip "multitask-backup-${STAMP}.sql"
          ls -la multitask-backup-*.sql.gz

      - name: Upload artifact (90-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: multitask-backup-${{ github.run_id }}
          path: multitask-backup-*.sql.gz
          retention-days: 90
          if-no-files-found: error
